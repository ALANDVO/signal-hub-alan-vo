# CI Workflow for signal-hub-alan-vo

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Backend tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run backend tests
        run: |
          .venv/bin/python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ./backend
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          DEBUG: "true"

  # Frontend tests and build
  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run build 2>&1 | head -20

      - name: Run frontend tests
        run: npm test

  # Build backend Docker image
  backend-docker:
    name: Build Backend Docker
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build frontend Docker image
  frontend-docker:
    name: Build Frontend Docker
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Integration test with docker compose
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [backend-docker, frontend-docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        run: |
          docker compose up -d postgres keycloak
          sleep 30
          docker compose up -d backend
          sleep 15
          docker compose up -d frontend
          sleep 10

      - name: Test backend health
        run: |
          for i in {1..10}; do
            if curl -f http://127.0.0.1:8000/api/v1/health; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Backend health check failed"
          docker compose logs backend
          exit 1

      - name: Test frontend
        run: |
          for i in {1..10}; do
            if curl -f http://127.0.0.1:80/; then
              echo "Frontend healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Frontend health check failed"
          docker compose logs frontend
          exit 1

      - name: Test issue analysis API
        run: |
          curl -f -X POST http://127.0.0.1:8000/api/v1/issues/analyze \
            -H "Content-Type: application/json" \
            -d '{"title": "JIT segfault", "body": "Segmentation fault in ZEND_NEW_SPEC_CONST_UNUSED_HANDLER"}'

      - name: Cleanup
        if: always()
        run: docker compose down -v